server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Blazor WASM assets need the correct MIME type.
    location ~ \.wasm$ {
        default_type application/wasm;
        add_header Cache-Control "no-cache";
    }

    # SPA fallback: unknown routes are handled client-side.
    location / {
        try_files $uri $uri/ /index.html =404;
    }
}
